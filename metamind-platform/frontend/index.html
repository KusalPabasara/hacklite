<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, minimum-scale=0.5, user-scalable=yes, viewport-fit=cover" />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="color-scheme" content="light dark" />
    
    <!-- Primary Meta Tags -->
    <title>Marga.lk - Career Guidance Platform</title>
    <meta name="title" content="Marga.lk - Career Guidance Platform" />
    <meta name="description" content="MetaMind Platform - Professional career guidance and mentorship for Sri Lankan youth. Discover your ideal career path through AI-powered assessments and personalized roadmaps." />
    <meta name="keywords" content="career guidance, Sri Lanka, career assessment, mentorship, professional development, career roadmap" />
    <meta name="author" content="Marga.lk" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://marga.kusalpabasara.me/" />
    <meta property="og:title" content="Marga.lk - Career Guidance Platform" />
    <meta property="og:description" content="Discover your ideal career path through AI-powered assessments and personalized roadmaps." />
    <meta property="og:image" content="https://marga.kusalpabasara.me/marga-logo.svg" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://marga.kusalpabasara.me/" />
    <meta property="twitter:title" content="Marga.lk - Career Guidance Platform" />
    <meta property="twitter:description" content="Discover your ideal career path through AI-powered assessments and personalized roadmaps." />
    <meta property="twitter:image" content="https://marga.kusalpabasara.me/marga-logo.svg" />
    
    <!-- Security Headers (Note: X-Frame-Options must be set via HTTP headers, not meta tags) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    
    <!-- PWA Support -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Marga.lk" />
    
    <!-- Accessibility -->
    <meta name="format-detection" content="telephone=no" />

    <!-- Preload critical fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- CSS for zoom normalization and font loading -->
    <style>
      /* Critical CSS for zoom normalization */
      * {
        box-sizing: border-box;
      }

      html {
        font-size: clamp(14px, 1.5vw, 16px);
        text-size-adjust: 100%;
        -webkit-text-size-adjust: 100%;
        -moz-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-display: swap;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      #root {
        min-height: 100vh;
        min-height: 100dvh;
      }

      /* Prevent zoom issues */
      @media screen and (max-width: 768px) {
        html {
          touch-action: manipulation;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="google_translate_element" style="display:none;"></div>

    <script type="module" src="/src/main.jsx"></script>
    
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  </body>
</html>
